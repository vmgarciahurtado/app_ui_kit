server {
    listen 80;
    server_name localhost;

    # Estáticos de Flutter Web (SPA: toda ruta cae en index.html)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Cache largo para assets fingerprinteados por Flutter
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
